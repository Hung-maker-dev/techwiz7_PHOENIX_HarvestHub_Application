name: harvesthub_mobile
description: HarvestHub - Nguoi 1 (Ha tang dung chung, Auth, trang tinh)
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # HTTP
  dio: ^5.4.3+1

  # i18n
  easy_localization: ^3.0.7

  # Auth
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  google_sign_in: ^6.2.1

  # Animation
  flutter_animate: ^4.5.0

  # Local storage / connectivity
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3
  shimmer: 3.0.0
  uuid: ^4.4.0
  image_picker: ^1.0.8
  intl: ^0.20.2
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  fl_chart: 0.69.0
  pdf: 3.11.1
  printing: 5.13.4
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^22.3.1
  firebase_storage: ^12.4.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/l10n/vi.json
    - lib/l10n/en.json
